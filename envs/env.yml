name: dreampy
channels:
  - conda-forge
  - bioconda

dependencies:
  # ── Core runtime ──
  - python=3.12
  - pip

  # Scientific computing
  - numpy>=2.0
  - scipy>=1.11
  - pandas>=2.0
  - anndata>=0.10
  - scanpy>=1.9
  - scikit-misc>=0.5        # LOWESS; conda recommended (pip metadata broken)
  - h5py>=3.10


  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13
  - matplotlib-venn>=1.1

  # ── R validation arm (optional) ──
  # - r-base=4.5.2
  # - r-devtools
  # - r-remotes
  # - rpy2>=3.5
  # - pyreadr
  # - feather-format

  # ── Development ──
  - pytest>=9.0
  - pytest-cov>=7.0
  - ruff>=0.15
  - mypy>=1.0
  - jupyter
  - jupyterlab
  - ipykernel
  - git
  - git-lfs

  # ── pip-only packages ──
  - pip:
    - Py-BOBYQA>=1.4

  # ── Notebook extras (figures, analysis) ──
  - tqdm>=4.60