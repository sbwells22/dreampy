name: dreampy
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python 3.12
  - python=3.12
  - pip
  
  # R 4.5.2 (latest, due to ARM64 compilation issues with R 4.2)
  - r-base=4.5.2
  - r-devtools
  - r-remotes
  
  # Python scientific computing
  - numpy>=1.21.0
  - scipy>=1.7.0
  - pandas>=1.3.0
  - scikit-learn>=1.0.0
  - statsmodels>=0.13.0
  - anndata>=0.8.0
  - scanpy>=1.9.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Jupyter ecosystem
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  
  # R-Python interoperability
  - rpy2>=3.5.0
  - pyreadr  # Read RDS files
  - feather-format  # Fast R-Python data transfer
  
  # Development tools
  - pytest>=7.0.0
  - pytest-cov
  - black>=22.0.0
  - flake8>=4.0.0
  - mypy>=0.950
  
  # Version control
  - git
  - git-lfs