[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreampy"
version = "0.1.0"
description = "Python implementation of dreamlet (validated against R dreamlet v1.8.0)"
readme = "README.md"
authors = [
    {name = "Steven B. Wells", email = "steven.buck.wells@gmail.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "anndata>=0.10",
    "scanpy>=1.9",
    "Py-BOBYQA>=1.4",
    "scikit-misc>=0.3",  # pip metadata is broken (reports 0.0.0); conda recommended
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sbwells22/dreampy"
Repository = "https://github.com/sbwells22/dreampy"
Documentation = "https://github.com/sbwells22/dreampy#readme"

[tool.setuptools]
packages = ["dreampy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py312"  # match your requires-python floor

[tool.ruff.lint]
select = [
    "F",      # pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors — syntax-level style issues
    "W",      # pycodestyle warnings — whitespace, blank lines
    "I",      # isort — import ordering
    "UP",     # pyupgrade — modernize syntax for your Python version
    "B",      # flake8-bugbear — common gotchas (mutable defaults, etc.)
    "SIM",    # flake8-simplify — unnecessarily complex expressions
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — we set line-length above, let formatter handle it
    "B905",   # zip strict — too noisy for scientific code
    "SIM108", # ternary operator — often less readable in math-heavy code
    "RUF005", # collection concatenation — numpy code uses + for arrays legitimately
    "RUF002", # ambiguous Unicode in docstring — intentional math symbols (θ, σ, Λ)
    "RUF003", # ambiguous Unicode in comment — same
    "RUF001", # ambiguous Unicode in string — same
    "SIM116", # dict vs if/elif — clearer as if/elif for return-value dispatch
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports are intentional in __init__.py (re-exports)

[tool.ruff.format]
quote-style = "double"

